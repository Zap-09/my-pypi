
name: Build Termux ARM64 Wheels

on:
  workflow_dispatch:
    inputs:
      package_names:
        description: "Space-separated PyPI package names"
        required: true

jobs:
  build:
    name: Build Termux Wheels (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Enable ARM64 emulation
        run: |
          docker run --rm --privileged \
            aptman/qus -s -- -p aarch64 arm

      - name: Pull Termux ARM64 image
        run: |
          docker pull --platform linux/arm64 \
            termux/termux-docker:aarch64

      - name: Build wheels inside Termux
        env:
          PACKAGES: ${{ inputs.package_names }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          mkdir -p wheelhouse

          docker run --rm --privileged \
            --platform linux/arm64 \
            -v "$PWD/wheelhouse:/wheelhouse" \
            -e PACKAGES="$PACKAGES" \
            -e PYTHON_VERSION="$PYTHON_VERSION" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -eu

              echo "Updating Termux..."
              pkg update -y

              echo "Installing TUR..."
              pkg install -y tur-repo

              pkg update -y

              echo "Installing Python versions..."
              apt install -y \
                python3.10 \
                python3.13 \

              echo "Installing build tools..."
              pkg install -y \
                uv \
                clang \
                rust \
                make \
                cmake \
                ninja \
                pkg-config \
                binutils \
                git

              VERSION="$PYTHON_VERSION"
              PYTHON="python${VERSION}"

              echo "Selected Python: $VERSION"

              if ! command -v "$PYTHON" >/dev/null 2>&1; then
                echo "ERROR: $PYTHON is not installed!"
                exit 1
              fi

              "$PYTHON" --version

              echo "Installing Python build tools..."

              "$PYTHON" -m pip install --upgrade pip

              "$PYTHON" -m pip install \
                build wheel setuptools \
                cython pybind11 \
                meson meson-python \
                maturin scikit-build-core

              OUTDIR="/wheelhouse/py${VERSION}"
              mkdir -p "$OUTDIR"

              echo "================================"
              echo "Building packages for Python $VERSION"
              echo "================================"

              for package in $PACKAGES; do
                echo "Building: $package"

                "$PYTHON" -m pip wheel \
                  --no-deps \
                  --no-binary=:all: \
                  "$package" \
                  --wheel-dir="$OUTDIR"

              done

              echo "Build completed!"

              ls -lh "$OUTDIR"
            '

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: termux-wheels-py${{ matrix.python-version }}
          path: wheelhouse/py${{ matrix.python-version }}/*.whl
          if-no-files-found: warn
          retention-days: 7